[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accform-layout-mcp"
version = "0.1.0"
description = "Render Microsoft Access SaveAsText form/report layouts (.bas) to SVG and expose it as an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "KIT-Technologies" }
]
dependencies = [
  "fastmcp>=3.0"
]
keywords = ["mcp", "access", "svg", "forms", "copilot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
png = [
  "cairosvg>=2.7"
]

[project.scripts]
accform-layout-mcp = "server:mcp_main"
accform-cli = "server:cli_main"

[tool.setuptools]
py-modules = ["server", "accform_render"]
